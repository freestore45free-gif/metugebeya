.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:10px}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;text-align:left;padding:0}
.thumb{aspect-ratio:4/3;display:grid;place-items:center;font-size:2.6rem;background:var(--thumb);overflow:hidden}

.price{color:var(--green);font-weight:800}.meta{color:var(--mute);font-size:.8rem}.note{font-size:.8rem;color:var(--mute)}
.empty{grid-column:1/-1;text-align:center;color:var(--mute);padding:40px 0}
dialog{border:0;border-radius:14px;padding:0;width:min(520px,94vw);max-height:92vh;background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(10,20,14,.6)}
.in{padding:18px;display:grid;gap:10px}
label{font-size:.85rem;font-weight:600;display:grid;gap:4px}
input,select,textarea{border:1px solid var(--line);border-radius:8px;padding:9px 10px;background:var(--card);width:100%}
textarea{min-height:90px;resize:vertical}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}
.pics{display:flex;gap:6px;flex-wrap:wrap}.pics img{width:64px;height:64px;object-fit:cover;border-radius:6px}
.slider{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;border-radius:10px;background:var(--thumb)}
.slider>div{flex:0 0 100%;scroll-snap-align:center;display:grid;place-items:center}
.slider img{width:100%;max-height:60vh;object-fit:contain}
.dots{display:flex;justify-content:center;gap:6px}.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--green)}
.plan{border:2px solid var(--line);border-radius:10px;padding:10px;cursor:pointer;text-align:center}
.plan.on{border-color:var(--green);background:var(--tint)}.plan b{display:block;font-size:1.3rem}
.box{border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--card)}
.av{border-radius:50%;object-fit:cover;background:var(--green);color:#fff;display:inline-grid;place-items:center;font-weight:800;flex:none}
.prof{display:flex;gap:14px;align-items:center;margin:8px 0 14px}
.seller{display:flex;align-items:center;gap:8px;border:0;background:none;cursor:pointer;padding:4px 0;text-align:left}
.mrow{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;background:var(--card)}
.tag{font-size:.7rem;background:var(--tint);border-radius:99px;padding:1px 8px;margin-right:6px}
.sw{display:flex;gap:12px;flex-wrap:wrap}.sw button{width:46px;height:46px;border-radius:50%;border:2px solid var(--line);cursor:pointer}.sw button.on{outline:3px solid var(--gold);outline-offset:2px}
nav{position:fixed;bottom:0;left:0;right:0;z-index:6;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;background:none;padding:8px 2px 6px;font-size:.7rem;color:var(--mute);display:grid;gap:2px;justify-items:center;cursor:pointer}
nav button span{font-size:1.35rem;line-height:1}nav button.on{color:var(--green);font-weight:700}
nav .plus span{background:var(--gold);color:#2a2100;border-radius:50%;width:46px;height:46px;display:grid;place-items:center;margin-top:-20px;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;display:none;z-index:9;max-width:90vw}

main{padding-bottom:120px}.toast{bottom:100px}
nav{left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));max-width:520px;margin:auto;border:1px solid var(--line);border-radius:28px;padding:6px;gap:2px;box-shadow:0 8px 28px rgba(0,0,0,.2)}

nav button.on{background:var(--tint);color:var(--green)}
nav .plus{flex:0 0 74px;background:none!important}
nav .plus span{width:52px;height:52px;margin-top:-24px;background:var(--gold);color:#2a2100;border-radius:50%;display:grid;place-items:center;box-shadow:0 4px 12px rgba(0,0,0,.3)}
nav .plus svg{width:26px;height:26px;stroke-width:2.6}
.pick{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;cursor:pointer;text-align:left;font-weight:400}
#cityP{width:auto;border-radius:99px;margin-bottom:10px;padding:7px 14px}
dialog#sheet{width:100vw;max-width:none;margin:auto 0 0 0;border-radius:24px 24px 0 0;padding:6px 0 18px;max-height:78vh}
.sh-h{padding:14px 22px 8px;font-weight:800;font-size:1.1rem}
.opt{display:flex;justify-content:space-between;align-items:center;width:100%;padding:15px 22px;border:0;background:none;font-size:1rem;cursor:pointer;text-align:left}
.opt i{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none}
.opt.on{background:var(--tint);font-weight:700}.opt.on i{border-color:var(--green);background:radial-gradient(var(--green) 0 45%,transparent 50%)}
dialog#lb{position:fixed;inset:0;width:100vw;height:100dvh;max-width:none;max-height:none;margin:0;border-radius:0;background:#000;overflow:hidden}
#lbBody{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;height:100%}

#lbX{position:absolute;top:14px;right:14px;z-index:2;width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,.2);color:#fff;font-size:1.4rem;cursor:pointer}
#lbN{position:absolute;top:22px;left:18px;z-index:2;color:#fff;font-weight:600}
.slider img{max-height:68vh;cursor:zoom-in}.pics img{width:96px;height:96px;cursor:zoom-in}
.avedit{position:relative;cursor:pointer;display:inline-block;flex:none}
.cam{position:absolute;right:-2px;bottom:-2px;background:var(--gold);border-radius:50%;width:28px;height:28px;display:grid;place-items:center;font-size:.85rem;border:2px solid var(--bg)}
.conv{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:10px;margin-bottom:8px;cursor:pointer}
.chatbar{display:flex;gap:10px;align-items:center;position:sticky;top:58px;z-index:3;background:var(--bg);padding:8px 0}
.chat{display:flex;flex-direction:column;gap:6px;padding:8px 0}
.bub{max-width:80%;padding:8px 12px;border-radius:16px 16px 16px 4px;background:var(--card);border:1px solid var(--line);align-self:flex-start;white-space:pre-wrap;word-break:break-word}

.bub small{display:block;font-size:.65rem;opacity:.7;margin-top:2px}
.cform{position:sticky;bottom:96px;display:flex;gap:8px;background:var(--bg);padding:8px 0}.cform input{flex:1;border-radius:99px;padding:11px 16px}
.slider>div{aspect-ratio:1/1;background:var(--thumb)}
.slider img{width:100%;height:100%;max-height:none;object-fit:cover;cursor:zoom-in}
body{overflow-x:hidden}
.ph{position:relative}
.slider{max-width:100%}
.slider>div{flex:0 0 100%;min-width:0;height:min(80vw,400px);aspect-ratio:auto;display:block;overflow:hidden}
.slider img{display:block;width:100%;height:100%;max-height:none;object-fit:cover}

.send{background:var(--green);color:#fff}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.cp{position:relative;display:inline-block;margin-bottom:6px}.cp img{height:90px;border-radius:10px;display:block}
.cp button{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;cursor:pointer}
.bimg{display:block;max-width:220px;width:100%;border-radius:12px;margin-bottom:4px;cursor:zoom-in}
nav button{position:relative}

.bdg[hidden]{display:none}
.hbtn{position:relative;flex:none;width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,.18);color:#fff;display:grid;place-items:center;cursor:pointer;margin-left:auto}

.thumb{position:relative}

.favb{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--mute);display:grid;place-items:center;cursor:pointer;flex:none}
.vtop{position:sticky;top:0;z-index:4;display:flex;justify-content:space-between;align-items:center;background:var(--card);padding-bottom:4px}
.vback{position:static;box-shadow:none}
.nb{flex:none;min-width:22px;height:22px;padding:0 6px;border-radius:99px;background:var(--red);color:#fff;font-size:.75rem;font-weight:700;display:grid;place-items:center}

</style>
</head>

function openInfo(){$('infoBody').innerHTML=`<h2>${t('aboutT')}</h2><p>${t('aboutP')}</p><h3>${t('termsT')}</h3><ul style="padding-left:18px;display:grid;gap:6px"><li>${t('terms1')}</li><li>${t('terms2')}</li><li>${t('terms3')}</li><li>${t('terms4')}</li></ul><h3>${t('contactT')}</h3><div class="row">${CONTACT.phone?`<a class="btn alt" href="tel:${CONTACT.phone}">${t('call')} ${CONTACT.phone}</a>`:''}${CONTACT.tg?`<a class="btn line" href="https://t.me/${CONTACT.tg}">Telegram</a>`:''}</div><button class="btn line" id="infoX">${t('close')}</button>`;
 $('infoX').onclick=()=>$('info').close();$('info').showModal()}
const dl=new URLSearchParams(location.search).get('l');
if(dl)db.collection('listings').doc(dl).get().then(d=>{if(d.exists){cache[d.id]={id:d.id,...d.data()};openItem(cache[d.id])}}).catch(()=>{});


/* ----- ወደታች ጎትቶ ማደስ (pull to refresh) ----- */
(function(){let sy=0,pull=0,on=false;const el=document.createElement('div');el.id='ptr';el.innerHTML='<span></span>';document.body.appendChild(el);
 const ok=t=>!document.querySelector('dialog[open]')&&!document.body.classList.contains('inchat')&&window.scrollY<=0&&!(t.closest&&t.closest('.slider,.filters,input,textarea,select,#lbBody'));
 const reset=()=>{el.style.opacity=0;el.style.transform='translate(-50%,-80px)';el.classList.remove('ready')};
 addEventListener('touchstart',e=>{on=ok(e.target);if(on){sy=e.touches[0].clientY;pull=0}},{passive:true});
 addEventListener('touchmove',e=>{if(!on)return;pull=e.touches[0].clientY-sy;
  if(pull>0){el.style.opacity=Math.min(1,pull/70);el.style.transform='translate(-50%,'+(Math.min(pull*.5,70)-80)+'px)';el.classList.toggle('ready',pull>110);if(e.cancelable)e.preventDefault()}else{on=false;reset()}},{passive:false});
 addEventListener('touchend',()=>{if(!on)return;on=false;
  if(pull>110){el.classList.add('spin');el.style.opacity=1;el.style.transform='translate(-50%,-10px)';try{sessionStorage.setItem('pv',view)}catch(x){}setTimeout(()=>location.reload(),250)}else reset()});
})();

/* ----- ማንኛውም ቁልፍ ሲነካ የሚዞር ምልክት ----- */
document.addEventListener('click',e=>{
 const b=e.target.closest('button,.btn,.chip,.card,.conv,.pick,.opt,.heart,.hbtn,.plan');
 if(!b||b.disabled||b.id==='lbX')return;
 const r=b.getBoundingClientRect(),host=b.closest('dialog')||document.body,s=document.createElement('div'),z=Math.round(Math.min(32,Math.max(20,Math.min(r.width,r.height)*.6)));
 s.className='tspin';s.style.cssText='width:'+z+'px;height:'+z+'px;left:'+(r.left+r.width/2-z/2)+'px;top:'+(r.top+r.height/2-z/2)+'px';
 host.appendChild(s);b.classList.add('tapd');
 const t0=Date.now(),iv=setInterval(()=>{const d=Date.now()-t0;if((d>700&&!b.disabled)||d>20000){clearInterval(iv);s.remove();b.classList.remove('tapd')}},120);
},true);

applyTheme();applyLang();
try{const pv=sessionStorage.getItem('pv');sessionStorage.removeItem('pv');if(pv&&['msg','acc','set','fav'].includes(pv))go(pv)}catch(x){}
</script>
