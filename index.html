<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>መቱ ገበያ</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Ethiopic:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f6ee;--ink:#17251c;--mute:#5d6b61;--green:#1e6b3a;--gold:#f2b705;--red:#c8372d;--card:#fff;--line:#dde6d8}
*{box-sizing:border-box;margin:0}
body{font-family:'Noto Sans Ethiopic',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;background:var(--green);color:#fff;padding:10px 14px}
.bar{display:flex;align-items:center;gap:10px;max-width:960px;margin:auto}
.logo{font-weight:800;font-size:1.25rem;white-space:nowrap}
.logo i{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--gold);margin-right:6px}
.search{flex:1;min-width:0;border:0;border-radius:8px;padding:9px 12px}
.btn{border:0;border-radius:8px;padding:9px 14px;font-weight:600;cursor:pointer;background:var(--gold);color:#2a2100}
.btn.alt{background:var(--green);color:#fff}.btn.line{background:#fff;border:1px solid var(--line)}
.btn.red{background:var(--red);color:#fff}
.btn:focus-visible,.chip:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
main{max-width:960px;margin:auto;padding:14px}
.hero{padding:18px 0 8px}
.hero h1{font-size:1.6rem;font-weight:800}.hero p{color:var(--mute)}
.filters{display:flex;gap:8px;overflow-x:auto;padding:10px 0}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 14px;white-space:nowrap;cursor:pointer}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
select.city{border:1px solid var(--line);border-radius:99px;padding:6px 10px;background:#fff}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;text-align:left;padding:0}
.thumb{aspect-ratio:4/3;display:grid;place-items:center;font-size:2.6rem;background:#e4ecdf}
.thumb img{width:100%;height:100%;object-fit:cover}
.card .t{padding:8px 10px 10px}.card b{display:block;font-size:.95rem}
.price{color:var(--green);font-weight:800}.meta{color:var(--mute);font-size:.8rem}
.empty{grid-column:1/-1;text-align:center;color:var(--mute);padding:40px 0}
dialog{border:0;border-radius:14px;padding:0;width:min(520px,94vw);max-height:92vh;color:var(--ink)}
dialog::backdrop{background:rgba(10,20,14,.6)}
.in{padding:18px;display:grid;gap:10px}
.in h2{font-size:1.2rem}
label{font-size:.85rem;font-weight:600;display:grid;gap:4px}
input,select,textarea{border:1px solid var(--line);border-radius:8px;padding:9px 10px;background:#fff;width:100%}
textarea{min-height:90px;resize:vertical}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}
.pics{display:flex;gap:6px;flex-wrap:wrap}.pics img{width:64px;height:64px;object-fit:cover;border-radius:6px}
.note{font-size:.8rem;color:var(--mute)}
.plan{border:2px solid var(--line);border-radius:10px;padding:10px;cursor:pointer;text-align:center}
.plan.on{border-color:var(--green);background:#e9f4ec}
.plan b{display:block;font-size:1.3rem}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;display:none;z-index:9}
</style>
</head>
<body>
<header><div class="bar">
  <div class="logo"><i></i>መቱ ገበያ</div>
  <input class="search" id="q" placeholder="ፈልግ..." aria-label="ፈልግ">
  <button class="btn line" id="acct">ግባ</button>
  <button class="btn" id="postBtn">ለጥፍ</button>
</div></header>

<main>
  <div class="hero"><h1>የመቱ ገበያ በእጅዎ</h1><p>ይግዙ፣ ይሽጡ፣ ሻጩን በቀጥታ ያግኙ።</p></div>
  <div class="filters" id="cats"></div>
  <div style="margin-bottom:10px"><select class="city" id="city" aria-label="ከተማ"></select></div>
  <div class="grid" id="grid"></div>
</main>

<!-- ማስታወቂያ ዝርዝር -->
<dialog id="view"><div class="in" id="viewBody"></div></dialog>

<!-- መለጠፊያ -->
<dialog id="post"><form class="in" id="postForm" method="dialog">
  <h2>ማስታወቂያ ለጥፍ</h2>
  <label>ርዕስ<input id="pTitle" required maxlength="60"></label>
  <div class="row">
    <label>ዋጋ (ብር)<input id="pPrice" type="number" min="0" required></label>
    <label>ምድብ<select id="pCat"></select></label>
  </div>
  <div class="row">
    <label>ከተማ<select id="pCity"></select></label>
    <label>ስልክ ቁጥር<input id="pPhone" type="tel" placeholder="09..." required></label>
  </div>
  <label>Telegram (አማራጭ)<input id="pTg" placeholder="@username"></label>
  <label>ስለሚሸጠው ዕቃ መግለጫ<textarea id="pDesc" required placeholder="ሁኔታ፣ መጠን፣ ሞዴል፣ ዋጋ ድርድር አለው?"></textarea></label>
  <label>ፎቶዎች<input id="pPics" type="file" accept="image/*" multiple></label>
  <div class="pics" id="preview"></div>
  <div class="note" id="picNote"></div>
  <div class="row"><button type="button" class="btn line" id="cancelPost">ተመለስ</button><button class="btn alt" type="submit">ለጥፍ</button></div>
</form></dialog>

<!-- ክፍያ -->
<dialog id="pay"><div class="in">
  <h2>ለመለጠፍ መጀመሪያ ይክፈሉ</h2>
  <p class="note">መመዝገብ ነጻ ነው። ማስታወቂያ ለመለጠፍ የሱቅ ኪራይ ይክፈሉ።</p>
  <div class="row">
    <div class="plan on" data-p="50"><b>50 ብር</b>ለ1 ወር</div>
    <div class="plan" data-p="300"><b>300 ብር</b>ለ1 ዓመት</div>
  </div>
  <p><b>CBE:</b> 1000597799431 (Girma)<br><b>Telebirr:</b> 0962765475 (Girma)</p>
  <label>የክፍያ Transaction ቁጥር<input id="txn" placeholder="ለምሳሌ FT2610..."></label>
  <p class="note">ከላኩ በኋላ አስተዳዳሪው ያረጋግጣል፤ ሲጸድቅ ወዲያው መለጠፍ ይችላሉ።</p>
  <div class="row"><button class="btn line" id="payCancel">ተመለስ</button><button class="btn alt" id="paySend">ክፍያ ላክ</button></div>
</div></dialog>


<dialog id="auth"><div class="in"><h2>መግቢያ</h2>
 <label>ኢሜይል<input id="aEmail" type="email" autocomplete="email"></label>
 <label>የይለፍ ቃል<input id="aPass" type="password" autocomplete="current-password"></label>
 <div class="row"><button class="btn line" id="authCancel">ተመለስ</button><button class="btn line" id="authToggle">አዲስ መለያ</button><button class="btn alt" id="authGo">ግባ</button></div></div></dialog>
<dialog id="menu"><div class="in"><h2>መለያዬ</h2><p class="note" id="mInfo"></p>
 <button class="btn alt" id="mInbox">መልእክቶች</button><button class="btn alt" id="mAdmin" style="display:none">አስተዳደር (ክፍያዎች)</button>
 <button class="btn line" id="mOut">ውጣ</button><button class="btn line" id="mClose">ዝጋ</button></div></dialog>
<dialog id="inbox"><div class="in"><h2>የደረሱኝ መልእክቶች</h2><div id="inList" class="in" style="padding:0"></div><button class="btn line" id="inClose">ዝጋ</button></div></dialog>
<dialog id="admin"><div class="in"><h2>የሚጠባበቁ ክፍያዎች</h2><div id="adList" class="in" style="padding:0"></div><button class="btn line" id="adClose">ዝጋ</button></div></dialog>
<div class="toast" id="toast" role="status"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* ===== 1) የራስሽን Firebase ቅንብር እዚህ ተካ ===== */
const FB={apiKey:"AIzaSyBTvp8e0KSc8FGszhgYc4A0XutYUDupb8o",authDomain:"metu-gebeya.firebaseapp.com",projectId:"metu-gebeya",appId:"1:531438387143:web:8f7d2204baef15940ee3e2"};
const ADMIN_EMAIL="freestore45free@gmail.com"; // የአንቺ (የአስተዳዳሪ) ኢሜይል፣ ከfirestore.rules ጋር ተመሳሳይ መሆን አለበት
/* ============================================== */
firebase.initializeApp(FB);
const auth=firebase.auth(),db=firebase.firestore();
const CATS=['ሁሉም','ስልኮች','ኤሌክትሮኒክስ','ተሽከርካሪ','ቤት እና መሬት','ፋሽን','ቤት ዕቃ','ሌላ'];
const CITIES=['ሁሉም ከተማ','መቱ','ጅማ','ጋምቤላ','አዲስ አበባ','ሌላ'];
const ICON={'ስልኮች':'📱','ኤሌክትሮኒክስ':'💻','ተሽከርካሪ':'🚗','ቤት እና መሬት':'🏠','ፋሽን':'👕','ቤት ዕቃ':'🛋️','ሌላ':'📦'};
const DAILY=10,MAXPIC=5;
const $=id=>document.getElementById(id);
const fmt=n=>Number(n).toLocaleString('en-US')+' ብር';
const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const today=()=>new Date().toISOString().slice(0,10);
let me=null,prof=null,items=[],plan=50,cat='ሁሉም',pics=[],reg=false,unsub=null;
const isAdmin=()=>me&&me.email===ADMIN_EMAIL;
const paid=()=>prof&&prof.paidUntil>Date.now();
const used=()=>prof&&prof.photosDay===today()?prof.photosCount:0;
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',3000)}

/* ----- መግቢያ ----- */
auth.onAuthStateChanged(async u=>{
 me=u;if(unsub)unsub();prof=null;
 if(u){const r=db.collection('users').doc(u.uid);
  if(!(await r.get()).exists)await r.set({email:u.email,paidUntil:0,photosDay:today(),photosCount:0});
  unsub=r.onSnapshot(d=>{prof=d.data();ui()});}
 ui();
});
function ui(){$('acct').textContent=me?'መለያ':'ግባ';
 $('mInfo').textContent=me?(paid()?'ክፍያ እስከ '+new Date(prof.paidUntil).toLocaleDateString():'ገና አልከፈሉም'):'';
 $('mAdmin').style.display=isAdmin()?'':'none';}
$('acct').onclick=()=>me?$('menu').showModal():$('auth').showModal();
$('authToggle').onclick=()=>{reg=!reg;$('authGo').textContent=reg?'ተመዝገብ':'ግባ';$('authToggle').textContent=reg?'መለያ አለኝ':'አዲስ መለያ'};
$('authCancel').onclick=()=>$('auth').close();
$('authGo').onclick=async()=>{
 const e=$('aEmail').value.trim(),p=$('aPass').value;
 try{reg?await auth.createUserWithEmailAndPassword(e,p):await auth.signInWithEmailAndPassword(e,p);$('auth').close()}
 catch(x){toast({'auth/email-already-in-use':'ይህ ኢሜይል ተመዝግቧል','auth/weak-password':'የይለፍ ቃል ቢያንስ 6 ፊደል ይሁን'}[x.code]||'ኢሜይል ወይም የይለፍ ቃል ትክክል አይደለም')}
};
$('mOut').onclick=()=>{auth.signOut();$('menu').close()};
$('mClose').onclick=()=>$('menu').close();

/* ----- ዝርዝር ----- */
function fill(){
 $('cats').innerHTML=CATS.map(c=>`<button class="chip ${c===cat?'on':''}" data-c="${c}">${c}</button>`).join('');
 $('city').innerHTML=CITIES.map(c=>`<option>${c}</option>`).join('');
 $('pCat').innerHTML=CATS.slice(1).map(c=>`<option>${c}</option>`).join('');
 $('pCity').innerHTML=CITIES.slice(1).map(c=>`<option>${c}</option>`).join('');
}
db.collection('listings').orderBy('created','desc').limit(80).onSnapshot(s=>{items=s.docs.map(d=>({id:d.id,...d.data()}));render()});
function render(){
 const q=$('q').value.trim().toLowerCase(),city=$('city').value;
 const l=items.filter(i=>(cat==='ሁሉም'||i.c===cat)&&(city==='ሁሉም ከተማ'||i.city===city)&&(!q||(i.t+i.d).toLowerCase().includes(q)));
 $('grid').innerHTML=l.length?l.map(i=>`<button class="card" data-i="${i.id}">
 <div class="thumb">${i.img&&i.img[0]?`<img src="${i.img[0]}" alt="">`:ICON[i.c]||'📦'}</div>
 <div class="t"><b>${esc(i.t)}</b><span class="price">${fmt(i.p)}</span><div class="meta">${esc(i.city)}${i.sold?' · ተሸጧል':''}</div></div></button>`).join('')
 :'<div class="empty">ምንም ማስታወቂያ አልተገኘም።</div>';
}
$('cats').onclick=e=>{const b=e.target.closest('.chip');if(b){cat=b.dataset.c;fill();render()}};
$('city').onchange=render;$('q').oninput=render;

$('grid').onclick=e=>{
 const c=e.target.closest('.card');if(!c)return;const i=items.find(x=>x.id===c.dataset.i);if(!i)return;
 const own=me&&me.uid===i.uid;
 const tg=i.tg?`<a class="btn line" href="https://t.me/${esc(i.tg.replace('@',''))}" target="_blank" rel="noopener">Telegram</a>`:'';
 $('viewBody').innerHTML=`<div class="thumb" style="border-radius:10px">${i.img&&i.img[0]?`<img src="${i.img[0]}" alt="">`:ICON[i.c]||'📦'}</div>
 <div class="pics">${(i.img||[]).slice(1).map(s=>`<img src="${s}" alt="">`).join('')}</div>
 <h2>${esc(i.t)}</h2><div class="price">${fmt(i.p)}</div><div class="meta">${esc(i.c)} · ${esc(i.city)}</div><p>${esc(i.d)}</p>
 <div class="row"><a class="btn alt" href="tel:${esc(i.ph)}" style="text-align:center;text-decoration:none">ደውል ${esc(i.ph)}</a>${tg}</div>
 ${own?`<div class="row"><button class="btn line" id="vSold">${i.sold?'እንደገና አሳይ':'ተሸጧል በል'}</button><button class="btn red" id="vDel">ሰርዝ</button></div>`:
 `<label>መልእክት ለሻጩ<textarea id="msg" placeholder="ሰላም፣ ይህ ዕቃ አሁንም አለ?"></textarea></label>
 <label>ስልክዎ (ሻጩ እንዲደውልልዎ)<input id="msgPh" type="tel"></label>
 <div class="row"><button class="btn alt" id="vSend">መልእክት ላክ</button><button class="btn red" id="vRep">Report</button></div>`}
 <button class="btn line" id="vClose">ዝጋ</button>`;
 $('view').showModal();$('vClose').onclick=()=>$('view').close();
 if(own){
  $('vSold').onclick=async()=>{await db.collection('listings').doc(i.id).update({sold:!i.sold});$('view').close()};
  $('vDel').onclick=async()=>{if(confirm('ይሰረዝ?')){await db.collection('listings').doc(i.id).delete();$('view').close()}};
 }else{
  $('vSend').onclick=async()=>{
   if(!me){$('view').close();$('auth').showModal();return}
   const t=$('msg').value.trim();if(!t)return;
   await db.collection('messages').add({listingId:i.id,listingTitle:i.t,sellerId:i.uid,fromId:me.uid,fromName:me.email,phone:$('msgPh').value,text:t,created:Date.now()});
   toast('መልእክት ተልኳል');$('view').close()};
  $('vRep').onclick=async()=>{if(!me){$('view').close();$('auth').showModal();return}
   await db.collection('reports').add({listingId:i.id,by:me.uid,created:Date.now()});toast('ሪፖርት ተልኳል');$('view').close()};
 }
};

/* ----- ለጥፍ እና ክፍያ ----- */
$('postBtn').onclick=()=>{if(!me)return $('auth').showModal();if(!paid())return $('pay').showModal();
 pics=[];$('preview').innerHTML='';$('postForm').reset();note();$('post').showModal()};
$('cancelPost').onclick=()=>$('post').close();
const note=()=>$('picNote').textContent=`ዛሬ ${used()+pics.length} / ${DAILY} ፎቶ (በአንድ ማስታወቂያ እስከ ${MAXPIC})`;
document.querySelectorAll('.plan').forEach(p=>p.onclick=()=>{document.querySelectorAll('.plan').forEach(x=>x.classList.remove('on'));p.classList.add('on');plan=+p.dataset.p});
$('payCancel').onclick=()=>$('pay').close();
$('paySend').onclick=async()=>{
 const t=$('txn').value.trim();if(t.length<6)return toast('የክፍያ Transaction ቁጥር ያስገቡ');
 await db.collection('payments').add({uid:me.uid,email:me.email,plan,txn:t,status:'pending',created:Date.now()});
 $('pay').close();toast('ክፍያው ተልኳል፤ አስተዳዳሪው ሲያረጋግጥ መለጠፍ ይችላሉ');
};
function shrink(f){return new Promise(r=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{
 const k=Math.min(1,700/Math.max(im.width,im.height)),c=document.createElement('canvas');
 c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.6))};im.src=fr.result};fr.readAsDataURL(f)})}
$('pPics').onchange=async e=>{
 for(const f of e.target.files){
  if(pics.length>=MAXPIC){toast('በአንድ ማስታወቂያ '+MAXPIC+' ፎቶ ብቻ');break}
  if(used()+pics.length>=DAILY){toast('በቀን 10 ፎቶ ብቻ ነው የሚፈቀደው');break}
  pics.push(await shrink(f));
 }
 $('preview').innerHTML=pics.map(s=>`<img src="${s}" alt="">`).join('');note();e.target.value='';
};
$('postForm').onsubmit=async e=>{
 e.preventDefault();if(!paid())return toast('መጀመሪያ ክፍያ ያድርጉ');
 const b=db.batch(),r=db.collection('listings').doc();
 b.set(r,{t:$('pTitle').value,p:+$('pPrice').value,c:$('pCat').value,city:$('pCity').value,d:$('pDesc').value,ph:$('pPhone').value,tg:$('pTg').value,img:pics,uid:me.uid,sold:false,created:Date.now()});
 b.update(db.collection('users').doc(me.uid),{photosDay:today(),photosCount:used()+pics.length});
 try{await b.commit();$('post').close();toast('ማስታወቂያው ተለጥፏል')}catch(x){toast('አልተለጠፈም፤ ክፍያዎ ጊዜው ሳይያልቅ አይቀርም')}
};

/* ----- መልእክቶች ----- */
$('mInbox').onclick=async()=>{$('menu').close();
 const s=await db.collection('messages').where('sellerId','==',me.uid).get();
 const l=s.docs.map(d=>d.data()).sort((a,b)=>b.created-a.created);
 $('inList').innerHTML=l.length?l.map(m=>`<div class="plan" style="text-align:left;cursor:default"><b style="font-size:1rem">${esc(m.listingTitle)}</b>${esc(m.text)}<div class="meta">${esc(m.fromName)}${m.phone?' · '+esc(m.phone):''}</div></div>`).join(''):'<p class="note">ምንም መልእክት የለም።</p>';
 $('inbox').showModal()};
$('inClose').onclick=()=>$('inbox').close();

/* ----- አስተዳዳሪ: ክፍያ ማጽደቅ ----- */
$('mAdmin').onclick=()=>{$('menu').close();loadPay();$('admin').showModal()};
$('adClose').onclick=()=>$('admin').close();
async function loadPay(){
 const s=await db.collection('payments').where('status','==','pending').get();
 const l=s.docs.map(d=>({id:d.id,...d.data()}));
 $('adList').innerHTML=l.length?l.map(p=>`<div class="plan" style="text-align:left;cursor:default">${esc(p.email)}<br><b style="font-size:1rem">${p.plan} ብር · ${esc(p.txn)}</b>
 <div class="row" style="margin-top:6px"><button class="btn alt" data-ok="${p.id}">ተቀበል</button><button class="btn red" data-no="${p.id}">ውድቅ</button></div></div>`).join(''):'<p class="note">የሚጠባበቅ ክፍያ የለም።</p>';
 $('adList').onclick=async e=>{const id=e.target.dataset.ok||e.target.dataset.no;if(!id)return;
  const p=l.find(x=>x.id===id),pr=db.collection('payments').doc(id);
  if(e.target.dataset.no){await pr.update({status:'rejected'});return loadPay()}
  const ur=db.collection('users').doc(p.uid),u=(await ur.get()).data();
  const until=Math.max(Date.now(),u.paidUntil||0)+(p.plan==300?365:30)*864e5;
  const b=db.batch();b.update(pr,{status:'approved'});b.update(ur,{paidUntil:until});await b.commit();toast('ተቀብሏል');loadPay()};
}
fill();render();
</script>
