 return `<h3>🔄 ${t('updSet')}</h3><div class="note">${updCfg.enabled?t('updOn')+' · v≥'+(updCfg.minVersion||0):t('updOff')}${updCfg.link?'<br>'+esc(updCfg.link):''}</div><button type="button" class="btn line" id="updEdit" style="margin-top:8px">✏️ ${t('edit')}</button>`+v}
function openUpdEdit(){$('uOn').checked=!!updCfg.enabled;$('uLink').value=updCfg.link||'';$('uMin').value=updCfg.minVersion||'';$('uMsg').value=updCfg.message||'';$('upddlg').showModal()}
$('uCancel').onclick=()=>$('upddlg').close();
$('uSave').onclick=async()=>{const b=$('uSave');b.disabled=true;
 try{await db.collection('config').doc('update').set({enabled:$('uOn').checked,link:$('uLink').value.trim(),minVersion:+$('uMin').value||0,message:$('uMsg').value.trim()});$('upddlg').close();toast(t('saved'))}
 catch(x){toast(t('err'))}b.disabled=false};


/* ----- በፎቶ መሃል የሻጭ ስምና Metu Gebeya (ደብዛዛ ውሃ ምልክት) ----- */
async function wm(src,name){try{await document.fonts.load('700 40px "Noto Sans Ethiopic"')}catch(e){}
 return new Promise(res=>{const im=new Image();
  im.onload=()=>{const c=document.createElement('canvas');c.width=im.width;c.height=im.height;const g=c.getContext('2d');g.drawImage(im,0,0);
   g.textAlign='center';g.textBaseline='middle';g.save();g.translate(im.width/2,im.height/2);g.rotate(-Math.PI/16);
   const draw=(txt,y,fs)=>{const set=s=>g.font='700 '+s+'px "Noto Sans Ethiopic",Arial,sans-serif';set(fs);
    while(g.measureText(txt).width>im.width*.78&&fs>12){fs-=2;set(fs)}
    g.lineWidth=Math.max(2,fs/10);g.lineJoin='round';g.strokeStyle='rgba(0,0,0,.2)';g.strokeText(txt,0,y);g.fillStyle='rgba(255,255,255,.4)';g.fillText(txt,0,y)};
   const f1=Math.round(im.width*.075),f2=Math.round(im.width*.05);
   draw(name,-f1*.4,f1);draw('Metu Gebeya',f2*.95,f2);g.restore();res(c.toDataURL('image/jpeg',.85))};
  im.onerror=()=>res(src);im.src=src})}
