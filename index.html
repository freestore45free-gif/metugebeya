document.addEventListener('click',e=>{const f=e.target.closest('.heart');if(f){e.preventDefault();toggleFav(f.dataset.f);return}const c=e.target.closest('.card');if(c&&cache[c.dataset.i])openItem(cache[c.dataset.i])});

function openItem(i){const own=me&&me.uid===i.uid,im=i.img||[];
 $('viewBody').innerHTML=`<div class="vtop"><button type="button" class="btn line vback" id="vBack">←</button><button type="button" class="favb ${favs.has(i.id)?'on':''}" id="vFav" data-f="${i.id}" aria-label="favorite">${HRT}</button></div>`+(im.length?`<div class="ph"><div class="slider" id="sl">${im.map(s=>`<div><img src="${s}" alt=""></div>`).join('')}</div><button type="button" class="zoomBtn" id="zoomBtn" aria-label="full screen">⤢</button></div>${im.length>1?`<div class="dots" id="dots">${im.map((_,k)=>`<i class="${k?'':'on'}"></i>`).join('')}</div>`:''}`:`<div class="thumb" style="border-radius:10px">${ICON[i.c]||'📦'}</div>`)+
 `<button class="seller" id="goShop"><span id="sAvt">${av('',i.shop||'?',36)}</span><b>${esc(i.shop||'')}</b> ›</button>
 <h2>${esc(i.t)}</h2><div class="price">${fmt(i.p)}</div><div class="meta">${esc(cn(i.c))} · ${esc(yn(i.city))}</div><p>${esc(i.d)}</p>
 <div class="row"><a class="btn alt" href="tel:${esc(i.ph)}">${t('call')} ${esc(i.ph)}</a>${i.tg?`<a class="btn line" href="https://t.me/${esc(i.tg.replace('@',''))}" target="_blank" rel="noopener">Telegram</a>`:''}</div>`+
 (own?`<div class="row"><button class="btn line" id="vSold">${t(i.sold?'unsold':'markSold')}</button><button class="btn red" id="vDel">${t('del')}</button></div>`:
 `<label>${t('msgSeller')}<textarea id="msg" placeholder="${t('msgPh')}"></textarea></label><label>${t('yourPhone')}<input id="msgPh" type="tel"></label><div class="row" style="align-items:center"><label class="btn line" for="msgImg" style="margin:0">📷 ${t('addPhoto')}</label><input id="msgImg" type="file" accept="image/*" hidden><span id="msgPrev"></span></div><div class="row"><button class="btn alt" id="vSend">${t('send')}</button><button class="btn red" id="vRep">${t('report')}</button></div>`)+
 `<button class="btn line" id="vClose">${t('close')}</button>`;
 $('view').showModal();$('vClose').onclick=$('vBack').onclick=()=>$('view').close();$('vFav').onclick=()=>toggleFav(i.id);
 const sl=$('sl'),dots=$('dots');if(sl&&dots)sl.onscroll=()=>{const k=Math.round(sl.scrollLeft/sl.clientWidth);[...dots.children].forEach((d,x)=>d.classList.toggle('on',x===k))};
 if(sl)sl.onclick=e=>{const m=e.target.closest('img');if(m)openLB(im,[...sl.querySelectorAll('img')].indexOf(m))};
 if($('zoomBtn'))$('zoomBtn').onclick=()=>openLB(im,Math.round(sl.scrollLeft/sl.clientWidth));
 db.collection('shops').doc(i.uid).get().then(d=>{if(d.exists&&d.data().avatar&&$('sAvt'))$('sAvt').innerHTML=av(d.data().avatar,i.shop,36)}).catch(()=>{});
 $('goShop').onclick=()=>{$('view').close();go('shop',i.uid)};
 if(own){$('vSold').onclick=async()=>{await db.collection('listings').doc(i.id).update({sold:!i.sold});$('view').close()};
  $('vDel').onclick=async()=>{if(confirm(t('confirmDel'))){await db.collection('listings').doc(i.id).delete();$('view').close();if(view==='shop')loadShop(i.uid)}}}
 else{let mImg=null;$('msgImg').onchange=async e=>{const f=e.target.files[0];if(!f)return;mImg=await shrink(f,800,.65);$('msgPrev').innerHTML=`<img src="${mImg}" style="height:44px;border-radius:8px;vertical-align:middle" alt="">`;e.target.value=''};$('vSend').onclick=async()=>{if(!me){$('view').close();go('acc');return toast(t('loginNeed'))}const x=$('msg').value.trim();if(!x&&!mImg)return;
   await db.collection('messages').add({threadId:i.id+'_'+me.uid,listingId:i.id,listingTitle:i.t,sellerId:i.uid,buyerId:me.uid,sellerName:i.shop||'',buyerName:me.email,fromId:me.uid,fromName:me.email,phone:$('msgPh').value,text:x,img:mImg||'',created:Date.now()});toast(t('msgSent'));$('view').close();go('msg');openT=i.id+'_'+me.uid;renderMsgs()};
  $('vRep').onclick=async()=>{if(!me){$('view').close();go('acc');return toast(t('loginNeed'))}await db.collection('reports').add({listingId:i.id,by:me.uid,created:Date.now()});toast(t('repSent'));$('view').close()}}}

/* ----- ሱቅ ገጽ ----- */
async function loadShop(uid){const el=$('v-shop');el.innerHTML='…';
 const [s,l]=await Promise.all([db.collection('shops').doc(uid).get(),db.collection('listings').where('uid','==',uid).get()]);
 const sh=s.exists?s.data():{},list=l.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>b.created-a.created),nm=sh.name||(list[0]&&list[0].shop)||'—';
 el.innerHTML=`<button class="btn line" id="shBack">← ${t('back')}</button><div class="prof" style="margin-top:12px">${av(sh.avatar,nm,76)}<div><b style="font-size:1.2rem">${esc(nm)}</b><p>${esc(sh.bio||'')}</p><div class="meta">${list.length} ${t('listings')}</div></div></div><div class="grid">${cards(list)}</div>`;
 $('shBack').onclick=()=>go('home')}

/* ----- መልእክቶች (ውይይት) ----- */
function listenMsgs(){['sellerId','buyerId','fromId'].forEach((f,k)=>unsubs.push(db.collection('messages').where(f,'==',me.uid).onSnapshot(s=>{qm[k]={};s.docs.forEach(d=>qm[k][d.id]={id:d.id,...d.data()});updBadge();if(view==='msg')renderMsgs(true)},()=>{})))}
function threads(){const all={};qm.forEach(o=>Object.assign(all,o));const T={};
 Object.values(all).forEach(m=>{const b=m.buyerId||m.fromId,tid=m.threadId||(m.listingId+'_'+b);
  const th=T[tid]||(T[tid]={tid,lid:m.listingId,title:m.listingTitle,seller:m.sellerId,buyer:b,msgs:[],sName:'',bName:'',phone:''});
  th.msgs.push(m);if(m.sellerName)th.sName=m.sellerName;
  if(m.fromId===b){th.bName=m.buyerName||m.fromName||th.bName;if(m.phone)th.phone=m.phone}});
 const l=Object.values(T);l.forEach(x=>x.msgs.sort((a,b)=>a.created-b.created));
 return l.sort((a,b)=>b.msgs[b.msgs.length-1].created-a.msgs[a.msgs.length-1].created)}
const tm=c=>new Date(c).toLocaleString([],{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
const other=th=>me.uid===th.seller?(th.bName||'').split('@')[0]:(th.sName||t('seller'));
function loadMsgs(){openT=null;renderMsgs()}
let cImg=null;
const CLIP='<svg class="ic" viewBox="0 0 24 24"><path d="M21 12.5l-8.6 8.6a5.5 5.5 0 0 1-7.8-7.8l9-9a3.7 3.7 0 0 1 5.2 5.2l-9 9a1.8 1.8 0 0 1-2.6-2.6l8.4-8.4"/></svg>',SND='<svg class="ic" viewBox="0 0 24 24"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/></svg>';
const bub=m=>`<div class="bub ${m.fromId===me.uid?'me':''}">${m.img?`<img class="bimg" src="${m.img}" alt="">`:''}${m.text?`<span>${esc(m.text)}</span>`:''}<small>${tm(m.created)}</small></div>`;
function renderMsgs(live){const el=$('v-msg');
 if(!me){document.body.classList.remove('inchat');el.innerHTML=`<h2>${t('msgs')}</h2><p class="note">${t('loginNeed')}</p><button class="btn alt" id="mLog" style="margin-top:8px">${t('login')}</button>`;$('mLog').onclick=()=>go('acc');return}
 const th=openT&&threads().find(x=>x.tid===openT);
 document.body.classList.toggle('inchat',!!th);
 if(!th){openT=null;const l=threads();
  el.innerHTML=`<h2>${t('msgs')}</h2>`+(l.length?l.map(x=>{const m=x.msgs[x.msgs.length-1];return `<button class="conv" data-t="${esc(x.tid)}">${av('',other(x),44)}<div style="min-width:0;flex:1"><b>${esc(x.title)}</b> <span class="meta">· ${esc(other(x))}</span><p class="meta" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${m.fromId===me.uid?'↩ ':''}${m.text?esc(m.text):'📷'}</p></div>${unread(x)?`<span class="nb">${unread(x)}</span>`:''}</button>`}).join(''):`<p class="note">${t('noMsg')}</p>`);return}
 const bubs=th.msgs.map(bub).join('');markRead(th);
 if(live&&$('chat')){$('chat').innerHTML=bubs;scrollTo(0,document.body.scrollHeight);return}
 cImg=null;
 el.innerHTML=`<div class="chatbar"><button class="btn line" id="cBack">←</button><div style="flex:1;min-width:0"><b>${esc(th.title)}</b><div class="meta">${esc(other(th))}</div></div>${th.phone&&me.uid===th.seller?`<a class="btn alt" href="tel:${esc(th.phone)}">${t('call')}</a>`:''}</div><div class="chat" id="chat">${bubs}</div><form class="cform" id="cForm"><div id="cPrev"></div><div class="crow"><label class="ci" for="cFile">${CLIP}</label><input id="cFile" type="file" accept="image/*" hidden><input id="cIn" autocomplete="off" placeholder="${t('typeMsg')}"><button class="send" aria-label="${t('send')}">${SND}</button></div></form>`;
 $('cBack').onclick=()=>{openT=null;renderMsgs()};
 $('cFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;cImg=await shrink(f,800,.65);$('cPrev').innerHTML=`<div class="cp"><img src="${cImg}" alt=""><button type="button" id="cX">✕</button></div>`;$('cX').onclick=()=>{cImg=null;$('cPrev').innerHTML=''};e.target.value=''};
 $('cForm').onsubmit=async e=>{e.preventDefault();const x=$('cIn').value.trim();if(!x&&!cImg)return;const im=cImg;$('cIn').value='';cImg=null;$('cPrev').innerHTML='';
  await db.collection('messages').add({threadId:th.tid,listingId:th.lid,listingTitle:th.title,sellerId:th.seller,buyerId:th.buyer,sellerName:me.uid===th.seller?((shop&&shop.name)||me.email.split('@')[0]):th.sName,buyerName:th.bName,fromId:me.uid,fromName:me.email,text:x,img:im||'',created:Date.now()})};
 scrollTo(0,document.body.scrollHeight)}
$('v-msg').onclick=e=>{const m=e.target.closest('.bimg');if(m)return openLB([m.src],0);const c=e.target.closest('.conv');if(c){openT=c.dataset.t;renderMsgs()}};

/* ----- ዘመናዊ ምርጫ (bottom sheet) እና ሙሉ ማያ ፎቶ ----- */
const CH='<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';
function refreshPicks(){[['city','city'],['pCat','cat'],['pCity','city']].forEach(([id,k])=>{const s=$(id);let b=$(id+'P');
 if(!b){b=document.createElement('button');b.type='button';b.id=id+'P';b.className='pick';s.after(b);s.style.display='none';b.onclick=()=>openSheet(s,k)}
 b.innerHTML=`<span>${esc(s.options[s.selectedIndex]?s.options[s.selectedIndex].text:'')}</span>${CH}`})}
function openSheet(s,k){const sh=$('sheet');$('shT').textContent=t(k);
 $('shO').innerHTML=[...s.options].map(o=>`<button type="button" class="opt ${o.value===s.value?'on':''}" data-v="${esc(o.value)}"><span>${esc(o.text)}</span><i></i></button>`).join('');
 $('shO').onclick=e=>{const b=e.target.closest('.opt');if(!b)return;s.value=b.dataset.v;s.dispatchEvent(new Event('change'));refreshPicks();sh.close()};sh.showModal()}
$('sheet').onclick=e=>{if(e.target===$('sheet'))$('sheet').close()};
function openLB(arr,k){$('lbBody').innerHTML=arr.map(s=>`<div><img src="${s}" alt=""></div>`).join('');$('lbN').textContent=arr.length>1?(k+1)+' / '+arr.length:'';$('lb').showModal();requestAnimationFrame(()=>{$('lbBody').scrollLeft=k*$('lbBody').clientWidth})}
$('lbBody').onscroll=()=>{const b=$('lbBody'),n=b.children.length;if(n>1)$('lbN').textContent=(Math.round(b.scrollLeft/b.clientWidth)+1)+' / '+n};
$('lbX').onclick=()=>$('lb').close();
$('preview').onclick=e=>{const m=e.target.closest('img');if(m)openLB(pics,[...$('preview').children].indexOf(m))};

/* ----- ቅንብር ----- */
function renderSet(){$('v-set').innerHTML=`<h2>${t('sets')}</h2><h3>${t('theme')}</h3><div class="sw">${TH.map(([k,c])=>`<button class="${k===theme?'on':''}" data-th="${k}" style="background:${c}" aria-label="${k}"></button>`).join('')}</div>
 <h3>${t('lang')}</h3><div class="row"><button class="btn ${lang==='am'?'alt':'line'}" data-lg="am">አማርኛ</button><button class="btn ${lang==='en'?'alt':'line'}" data-lg="en">English</button><button class="btn ${lang==='om'?'alt':'line'}" data-lg="om">Afaan Oromoo</button></div>`}
$('v-set').onclick=e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.th){theme=b.dataset.th;setStore('theme',theme);applyTheme();renderSet()}
 if(b.dataset.lg){lang=b.dataset.lg;setStore('lang',lang);applyLang()}};

/* ----- ለጥፍ እና ክፍያ ----- */
function postClick(){if(!me){go('acc');return toast(t('loginNeed'))}if(!paid())return $('pay').showModal();
 pics=[];$('preview').innerHTML='';$('postForm').reset();refreshPicks();note();$('post').showModal()}
$('cancelPost').onclick=()=>$('post').close();
const note=()=>$('picNote').textContent=t('picNote').replace('{a}',used()+pics.length).replace('{b}',10);
Q('.plan').forEach(p=>p.onclick=()=>{Q('.plan').forEach(x=>x.classList.remove('on'));p.classList.add('on');plan=+p.dataset.p});
$('payCancel').onclick=()=>$('pay').close();
$('paySend').onclick=async()=>{if(!me){$('pay').close();return go('acc')}
 const x=$('txn').value.trim();if(x.length<6)return toast(t('txnErr'));
 await db.collection('payments').add({uid:me.uid,email:me.email,plan,txn:x,status:'pending',created:Date.now()});$('pay').close();toast(t('payOk'))};
function shrink(f,max,q){return new Promise(r=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{
 const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',q))};im.src=fr.result};fr.readAsDataURL(f)})}
$('pPics').onchange=async e=>{
 for(const f of e.target.files){if(pics.length>=3){toast(t('picMax'));break}if(used()+pics.length>=10){toast(t('picDay'));break}pics.push(await shrink(f,700,.6))}
 $('preview').innerHTML=pics.map(s=>`<img src="${s}" alt="">`).join('');note();e.target.value=''};
$('postForm').onsubmit=async e=>{e.preventDefault();if(!paid())return toast(t('payFirst'));
 const b=db.batch(),r=db.collection('listings').doc();
 b.set(r,{t:$('pTitle').value,p:+$('pPrice').value,c:$('pCat').value,city:$('pCity').value,d:$('pDesc').value,ph:$('pPhone').value,tg:$('pTg').value,img:pics,uid:me.uid,shop:(shop&&shop.name)||me.email.split('@')[0],sold:false,created:Date.now()});
 b.update(db.collection('users').doc(me.uid),{photosDay:today(),photosCount:used()+pics.length});
 try{await b.commit();$('post').close();toast(t('posted'))}catch(x){toast(t('postFail'))}};

/* ----- አስተዳዳሪ ----- */
$('adClose').onclick=()=>$('admin').close();
async function loadPay(){const s=await db.collection('payments').get(),all=s.docs.map(d=>({id:d.id,...d.data()})),cnt={},K=p=>String(p.txn).trim().toLowerCase();
 all.forEach(p=>{cnt[K(p)]=(cnt[K(p)]||0)+1});
 const l=all.filter(p=>p.status==='pending').sort((a,b)=>a.created-b.created);
 $('adList').innerHTML=l.length?l.map(p=>`<div class="box"><div style="font-size:1.5rem;font-weight:800;color:var(--green)">${p.plan} ${t('birr')} <span style="font-size:.9rem;font-weight:600">· ${t(p.plan==300?'y1':'m1')}</span></div><div>${esc(p.email)}</div><div><b>${esc(p.txn)}</b></div><div class="meta">${tm(p.created)}</div>${cnt[K(p)]>1?`<div style="color:var(--red);font-weight:700">${t('dup')}</div>`:''}<div class="row" style="margin-top:6px"><button class="btn alt" data-ok="${p.id}">${t('approve')}</button><button class="btn red" data-no="${p.id}">${t('reject')}</button></div></div>`).join(''):`<p class="note">${t('noPending')}</p>`;
 $('adList').onclick=async e=>{const id=e.target.dataset.ok||e.target.dataset.no;if(!id)return;const p=l.find(x=>x.id===id),pr=db.collection('payments').doc(id);
  if(e.target.dataset.no){await pr.update({status:'rejected'});return loadPay()}
  if(!confirm(t('confirmApprove').replace('{a}',p.plan)))return;
  const ur=db.collection('users').doc(p.uid),u=(await ur.get()).data(),until=Math.max(Date.now(),u.paidUntil||0)+(p.plan==300?365:30)*864e5,b=db.batch();
  b.update(pr,{status:'approved'});b.update(ur,{paidUntil:until});await b.commit();toast(t('approved'));loadPay()}}

/* ----- ያልተነበበ መልእክት ቁጥር ----- */
function loadRd(){try{rd=JSON.parse(localStorage.getItem('rd:'+me.uid)||'{}')}catch(e){rd={}}}
function saveRd(){try{localStorage.setItem('rd:'+me.uid,JSON.stringify(rd))}catch(e){}}
const unread=th=>th.msgs.filter(m=>m.fromId!==me.uid&&m.created>(rd[th.tid]||0)).length;
function markRead(th){const last=th.msgs[th.msgs.length-1].created;if((rd[th.tid]||0)<last){rd[th.tid]=last;saveRd();updBadge()}}
function updBadge(){const b=$('bdg');if(!b)return;const n=me?threads().reduce((a,th)=>a+unread(th),0):0;b.hidden=!n;b.textContent=n>99?'99+':n}

/* ----- ተወዳጆች (ልብ) ----- */
const HRT='<svg class="ic" viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z"/></svg>';
const heart=id=>`<span class="heart ${favs.has(id)?'on':''}" data-f="${id}">${HRT}</span>`;
function renderHearts(){Q('.heart,.favb').forEach(x=>x.classList.toggle('on',favs.has(x.dataset.f)));const n=favs.size,b=$('fbd');b.hidden=!n;b.textContent=n}
function toggleFav(id){if(!me){go('acc');return toast(t('loginNeed'))}
 const F=firebase.firestore.FieldValue;db.collection('favs').doc(me.uid).set({ids:favs.has(id)?F.arrayRemove(id):F.arrayUnion(id)},{merge:true}).catch(()=>toast(t('err')))}
$('favBtn').onclick=()=>go('fav');
async function renderFav(){const el=$('v-fav'),hd=`<h2>${t('favs')}</h2>`;
 if(!me){el.innerHTML=hd+`<p class="note">${t('loginNeed')}</p><button class="btn alt" id="fLog" style="margin-top:8px">${t('login')}</button>`;$('fLog').onclick=()=>go('acc');return}
 const ids=[...favs];if(!ids.length){el.innerHTML=hd+`<p class="note">${t('noFav')}</p>`;return}
 const list=[],miss=[];ids.forEach(id=>{const x=cache[id]||items.find(i=>i.id===id);x?list.push(x):miss.push(id)});
 const show=()=>{list.sort((a,b)=>b.created-a.created);el.innerHTML=hd+`<div class="grid">${cards(list)}</div>`};show();
 if(miss.length){const ds=await Promise.all(miss.map(id=>db.collection('listings').doc(id).get().catch(()=>null)));
  ds.forEach(d=>{if(d&&d.exists)list.push({id:d.id,...d.data()})});if(view==='fav')show()}}

applyTheme();applyLang();
</script>
</body>
