*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Noto Sans Ethiopic',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}

.price{color:var(--green);font-weight:800}.meta{color:var(--mute);font-size:.8rem}.note{font-size:.8rem;color:var(--mute)}
.empty{grid-column:1/-1;text-align:center;color:var(--mute);padding:40px 0}
dialog{border:0;border-radius:14px;padding:0;width:min(520px,94vw);max-height:92vh;background:var(--card);color:var(--ink)}

.in{padding:18px;display:grid;gap:10px}
label{font-size:.85rem;font-weight:600;display:grid;gap:4px}
input,select,textarea{border:1px solid var(--line);border-radius:8px;padding:9px 10px;background:var(--card);width:100%}

.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}
.pics{display:flex;gap:6px;flex-wrap:wrap}.pics img{width:64px;height:64px;object-fit:cover;border-radius:6px}
.slider{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;border-radius:10px;background:var(--thumb)}

.prof{display:flex;gap:14px;align-items:center;margin:8px 0 14px}

.mrow{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;background:var(--card)}
.tag{font-size:.7rem;background:var(--tint);border-radius:99px;padding:1px 8px;margin-right:6px}

const fmt=n=>Number(n).toLocaleString('en-US')+' '+t('birr');
const today=()=>new Date().toISOString().slice(0,10);
const isAdmin=()=>me&&me.email===ADMIN_EMAIL,paid=()=>prof&&prof.paidUntil>Date.now(),used=()=>prof&&prof.photosDay===today()?prof.photosCount:0;
const av=(s,n,z)=>s?`<img class="av" style="width:${z}px;height:${z}px" src="${s}" alt="">`:`<span class="av" style="width:${z}px;height:${z}px;font-size:${z/2}px">${esc((n||'?')[0].toUpperCase())}</span>`;
function toast(m){const e=$('toast');e.textContent=m;e.style.display='block';setTimeout(()=>e.style.display='none',3000)}
try{localStorage.setItem('t','1')}catch(e){}
function setStore(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function applyTheme(){document.documentElement.dataset.theme=theme}
function applyLang(){document.documentElement.lang=lang;document.title=t('app');
 Q('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));Q('[data-ph]').forEach(e=>e.placeholder=t(e.dataset.ph));fill();go(view,shopArg)}
function fill(){const cv=$('city').value,pc=$('pCat').value,pt=$('pCity').value;
 $('cats').innerHTML=CATS.map(c=>`<button class="chip ${c===cat?'on':''}" data-c="${c}">${cn(c)}</button>`).join('');
 const o=(a,f)=>a.map(c=>`<option value="${c}">${f(c)}</option>`).join('');
 $('city').innerHTML=o(CITIES,yn);$('pCat').innerHTML=o(CATS.slice(1),cn);$('pCity').innerHTML=o(CITIES.slice(1),yn);
 if(cv)$('city').value=cv;if(pc)$('pCat').value=pc;if(pt)$('pCity').value=pt}

/* ----- ገጾች መቀያየር ----- */
let shopArg=null;
function go(v,arg){view=v;shopArg=arg||null;
 ['home','msg','acc','set','shop'].forEach(x=>$('v-'+x).hidden=x!==v);
 Q('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
 $('q').style.display=v==='home'?'':'none';
 ({home:render,msg:loadMsgs,acc:renderAcc,set:renderSet,shop:()=>loadShop(arg)})[v]();scrollTo(0,0)}
$('nav').onclick=e=>{const b=e.target.closest('button');if(!b)return;b.dataset.v==='post'?postClick():go(b.dataset.v)};

/* ----- መግቢያ እና ፕሮፋይል ----- */
auth.onAuthStateChanged(async u=>{
 me=u;unsubs.forEach(f=>f());unsubs=[];prof=null;shop=null;
 if(u){const r=db.collection('users').doc(u.uid);
  if(!(await r.get()).exists)await r.set({email:u.email,paidUntil:0,photosDay:today(),photosCount:0});
  unsubs.push(r.onSnapshot(d=>{prof=d.data();if(view==='acc')renderAcc()}));
  unsubs.push(db.collection('shops').doc(u.uid).onSnapshot(d=>{shop=d.exists?d.data():null;if(view==='acc')renderAcc()}));}
 if(view==='acc'||view==='msg')go(view)});
async function doAuth(){const e=$('aEmail').value.trim(),p=$('aPass').value;
 try{reg?await auth.createUserWithEmailAndPassword(e,p):await auth.signInWithEmailAndPassword(e,p)}
 catch(x){toast({'auth/email-already-in-use':t('dupe'),'auth/weak-password':t('weak')}[x.code]||t('authErr'))}}
function renderAcc(){const el=$('v-acc');
 if(!me){el.innerHTML=`<h2>${t(reg?'register':'login')}</h2><div class="in" style="padding:0"><label>${t('email')}<input id="aEmail" type="email" autocomplete="email"></label><label>${t('pass')}<input id="aPass" type="password"></label><button class="btn alt" id="authGo">${t(reg?'register':'login')}</button><button class="btn line" id="authToggle">${t(reg?'haveAcc':'newAcc')}</button></div>`;
  $('authGo').onclick=doAuth;$('authToggle').onclick=()=>{reg=!reg;renderAcc()};return}
 const nm=(shop&&shop.name)||me.email.split('@')[0];newAv=null;
 el.innerHTML=`<div class="prof">${av(shop&&shop.avatar,nm,72)}<div><b style="font-size:1.1rem">${esc(nm)}</b><div class="meta">${esc(me.email)}</div><div class="meta">${paid()?t('paidUntil')+' '+new Date(prof.paidUntil).toLocaleDateString():t('notPaid')}</div></div></div>
 <div class="in" style="padding:0"><label>${t('shopName')}<input id="sName" maxlength="40" value="${esc((shop&&shop.name)||'')}"></label>
 <label>${t('bio')}<textarea id="sBio" maxlength="200">${esc((shop&&shop.bio)||'')}</textarea></label>
 <label>${t('avatar')}<input id="sAv" type="file" accept="image/*"></label>
 <div class="row"><button class="btn alt" id="sSave">${t('save')}</button><button class="btn line" id="sView">${t('myShop')}</button></div>
 <button class="btn" id="aPay">${t('payBtn')}</button>${isAdmin()?`<button class="btn line" id="aAdm">${t('admin')}</button>`:''}<button class="btn line" id="aOut">${t('logout')}</button></div>`;
 $('sAv').onchange=async e=>{if(e.target.files[0])newAv=await shrink(e.target.files[0],240,.7)};
 $('sSave').onclick=async()=>{await db.collection('shops').doc(me.uid).set({uid:me.uid,name:$('sName').value.trim()||me.email.split('@')[0],bio:$('sBio').value.trim(),avatar:newAv!==null?newAv:((shop&&shop.avatar)||'')});toast(t('saved'))};
 $('sView').onclick=()=>go('shop',me.uid);$('aPay').onclick=()=>$('pay').showModal();
 if(isAdmin())$('aAdm').onclick=()=>{loadPay();$('admin').showModal()};
 $('aOut').onclick=()=>auth.signOut()}

/* ----- ዋና ገጽ ----- */
db.collection('listings').orderBy('created','desc').limit(80).onSnapshot(s=>{items=s.docs.map(d=>({id:d.id,...d.data()}));if(view==='home')render()});
function cards(l){l.forEach(i=>cache[i.id]=i);return l.length?l.map(i=>`<button class="card" data-i="${i.id}"><div class="thumb">${i.img&&i.img[0]?`<img src="${i.img[0]}" alt="">`:ICON[i.c]||'📦'}</div><div class="t"><b>${esc(i.t)}</b><span class="price">${fmt(i.p)}</span><div class="meta">${esc(yn(i.city))}${i.sold?' · '+t('sold'):''}</div></div></button>`).join(''):`<div class="empty">${t('noItems')}</div>`}
function render(){const q=$('q').value.trim().toLowerCase(),city=$('city').value;
 $('grid').innerHTML=cards(items.filter(i=>(cat==='ሁሉም'||i.c===cat)&&(city==='ሁሉም ከተማ'||i.city===city)&&(!q||(i.t+i.d).toLowerCase().includes(q))))}
$('cats').onclick=e=>{const b=e.target.closest('.chip');if(b){cat=b.dataset.c;fill();render()}};
$('city').onchange=render;$('q').oninput=render;
document.addEventListener('click',e=>{const c=e.target.closest('.card');if(c&&cache[c.dataset.i])openItem(cache[c.dataset.i])});

function openItem(i){const own=me&&me.uid===i.uid,im=i.img||[];
 $('viewBody').innerHTML=(im.length?`<div class="slider" id="sl">${im.map(s=>`<div><img src="${s}" alt=""></div>`).join('')}</div>${im.length>1?`<div class="dots" id="dots">${im.map((_,k)=>`<i class="${k?'':'on'}"></i>`).join('')}</div>`:''}`:`<div class="thumb" style="border-radius:10px">${ICON[i.c]||'📦'}</div>`)+
 `<button class="seller" id="goShop"><span id="sAvt">${av('',i.shop||'?',36)}</span><b>${esc(i.shop||'')}</b> ›</button>
 <h2>${esc(i.t)}</h2><div class="price">${fmt(i.p)}</div><div class="meta">${esc(cn(i.c))} · ${esc(yn(i.city))}</div><p>${esc(i.d)}</p>
 <div class="row"><a class="btn alt" href="tel:${esc(i.ph)}">${t('call')} ${esc(i.ph)}</a>${i.tg?`<a class="btn line" href="https://t.me/${esc(i.tg.replace('@',''))}" target="_blank" rel="noopener">Telegram</a>`:''}</div>`+
 (own?`<div class="row"><button class="btn line" id="vSold">${t(i.sold?'unsold':'markSold')}</button><button class="btn red" id="vDel">${t('del')}</button></div>`:
 `<label>${t('msgSeller')}<textarea id="msg" placeholder="${t('msgPh')}"></textarea></label><label>${t('yourPhone')}<input id="msgPh" type="tel"></label><div class="row"><button class="btn alt" id="vSend">${t('send')}</button><button class="btn red" id="vRep">${t('report')}</button></div>`)+
 `<button class="btn line" id="vClose">${t('close')}</button>`;
 $('view').showModal();$('vClose').onclick=()=>$('view').close();
 const sl=$('sl'),dots=$('dots');if(sl&&dots)sl.onscroll=()=>{const k=Math.round(sl.scrollLeft/sl.clientWidth);[...dots.children].forEach((d,x)=>d.classList.toggle('on',x===k))};
 db.collection('shops').doc(i.uid).get().then(d=>{if(d.exists&&d.data().avatar&&$('sAvt'))$('sAvt').innerHTML=av(d.data().avatar,i.shop,36)}).catch(()=>{});
 $('goShop').onclick=()=>{$('view').close();go('shop',i.uid)};
 if(own){$('vSold').onclick=async()=>{await db.collection('listings').doc(i.id).update({sold:!i.sold});$('view').close()};
  $('vDel').onclick=async()=>{if(confirm(t('confirmDel'))){await db.collection('listings').doc(i.id).delete();$('view').close();if(view==='shop')loadShop(i.uid)}}}
 else{$('vSend').onclick=async()=>{if(!me){$('view').close();go('acc');return toast(t('loginNeed'))}const x=$('msg').value.trim();if(!x)return;
   await db.collection('messages').add({listingId:i.id,listingTitle:i.t,sellerId:i.uid,fromId:me.uid,fromName:me.email,phone:$('msgPh').value,text:x,created:Date.now()});toast(t('msgSent'));$('view').close()};
  $('vRep').onclick=async()=>{if(!me){$('view').close();go('acc');return toast(t('loginNeed'))}await db.collection('reports').add({listingId:i.id,by:me.uid,created:Date.now()});toast(t('repSent'));$('view').close()}}}

/* ----- ሱቅ ገጽ ----- */
async function loadShop(uid){const el=$('v-shop');el.innerHTML='…';
 const [s,l]=await Promise.all([db.collection('shops').doc(uid).get(),db.collection('listings').where('uid','==',uid).get()]);
 const sh=s.exists?s.data():{},list=l.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>b.created-a.created),nm=sh.name||(list[0]&&list[0].shop)||'—';
 el.innerHTML=`<button class="btn line" id="shBack">← ${t('back')}</button><div class="prof" style="margin-top:12px">${av(sh.avatar,nm,76)}<div><b style="font-size:1.2rem">${esc(nm)}</b><p>${esc(sh.bio||'')}</p><div class="meta">${list.length} ${t('listings')}</div></div></div><div class="grid">${cards(list)}</div>`;
 $('shBack').onclick=()=>go('home')}

/* ----- መልእክቶች ----- */
async function loadMsgs(){const el=$('v-msg'),h=`<h2>${t('msgs')}</h2>`;
 if(!me){el.innerHTML=h+`<p class="note">${t('loginNeed')}</p><button class="btn alt" id="mLog" style="margin-top:8px">${t('login')}</button>`;$('mLog').onclick=()=>go('acc');return}
 el.innerHTML=h+'…';
 const [a,b]=await Promise.all([db.collection('messages').where('sellerId','==',me.uid).get(),db.collection('messages').where('fromId','==',me.uid).get()]);
 const l=[...a.docs.map(d=>({...d.data(),k:'in'})),...b.docs.map(d=>({...d.data(),k:'out'}))].sort((x,y)=>y.created-x.created);
 el.innerHTML=h+(l.length?l.map(m=>`<div class="mrow"><span class="tag">${t(m.k==='in'?'inbox':'sentL')}</span><b>${esc(m.listingTitle)}</b><p>${esc(m.text)}</p>${m.k==='in'?`<div class="meta">${esc(m.fromName)}${m.phone?' · '+esc(m.phone):''}</div>`:''}</div>`).join(''):`<p class="note">${t('noMsg')}</p>`)}

/* ----- ቅንብር ----- */
function renderSet(){$('v-set').innerHTML=`<h2>${t('sets')}</h2><h3>${t('theme')}</h3><div class="sw">${TH.map(([k,c])=>`<button class="${k===theme?'on':''}" data-th="${k}" style="background:${c}" aria-label="${k}"></button>`).join('')}</div>
 <h3>${t('lang')}</h3><div class="row"><button class="btn ${lang==='am'?'alt':'line'}" data-lg="am">አማርኛ</button><button class="btn ${lang==='en'?'alt':'line'}" data-lg="en">English</button></div>`}
$('v-set').onclick=e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.th){theme=b.dataset.th;setStore('theme',theme);applyTheme();renderSet()}
 if(b.dataset.lg){lang=b.dataset.lg;setStore('lang',lang);applyLang()}};

/* ----- ለጥፍ እና ክፍያ ----- */
function postClick(){if(!me){go('acc');return toast(t('loginNeed'))}if(!paid())return $('pay').showModal();
 pics=[];$('preview').innerHTML='';$('postForm').reset();note();$('post').showModal()}
$('cancelPost').onclick=()=>$('post').close();
const note=()=>$('picNote').textContent=t('picNote').replace('{a}',used()+pics.length).replace('{b}',10);
Q('.plan').forEach(p=>p.onclick=()=>{Q('.plan').forEach(x=>x.classList.remove('on'));p.classList.add('on');plan=+p.dataset.p});
$('payCancel').onclick=()=>$('pay').close();
$('paySend').onclick=async()=>{if(!me){$('pay').close();return go('acc')}
 const x=$('txn').value.trim();if(x.length<6)return toast(t('txnErr'));
 await db.collection('payments').add({uid:me.uid,email:me.email,plan,txn:x,status:'pending',created:Date.now()});$('pay').close();toast(t('payOk'))};
function shrink(f,max,q){return new Promise(r=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{
 const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',q))};im.src=fr.result};fr.readAsDataURL(f)})}
$('pPics').onchange=async e=>{
 for(const f of e.target.files){if(pics.length>=3){toast(t('picMax'));break}if(used()+pics.length>=10){toast(t('picDay'));break}pics.push(await shrink(f,700,.6))}
 $('preview').innerHTML=pics.map(s=>`<img src="${s}" alt="">`).join('');note();e.target.value=''};
$('postForm').onsubmit=async e=>{e.preventDefault();if(!paid())return toast(t('payFirst'));
 const b=db.batch(),r=db.collection('listings').doc();
 b.set(r,{t:$('pTitle').value,p:+$('pPrice').value,c:$('pCat').value,city:$('pCity').value,d:$('pDesc').value,ph:$('pPhone').value,tg:$('pTg').value,img:pics,uid:me.uid,shop:(shop&&shop.name)||me.email.split('@')[0],sold:false,created:Date.now()});
 b.update(db.collection('users').doc(me.uid),{photosDay:today(),photosCount:used()+pics.length});
 try{await b.commit();$('post').close();toast(t('posted'))}catch(x){toast(t('postFail'))}};

/* ----- አስተዳዳሪ ----- */
$('adClose').onclick=()=>$('admin').close();
async function loadPay(){const s=await db.collection('payments').where('status','==','pending').get(),l=s.docs.map(d=>({id:d.id,...d.data()}));
 $('adList').innerHTML=l.length?l.map(p=>`<div class="box">${esc(p.email)}<br><b>${p.plan} ${t('birr')} · ${esc(p.txn)}</b><div class="row" style="margin-top:6px"><button class="btn alt" data-ok="${p.id}">${t('approve')}</button><button class="btn red" data-no="${p.id}">${t('reject')}</button></div></div>`).join(''):`<p class="note">${t('noPending')}</p>`;
 $('adList').onclick=async e=>{const id=e.target.dataset.ok||e.target.dataset.no;if(!id)return;const p=l.find(x=>x.id===id),pr=db.collection('payments').doc(id);
  if(e.target.dataset.no){await pr.update({status:'rejected'});return loadPay()}
  const ur=db.collection('users').doc(p.uid),u=(await ur.get()).data(),until=Math.max(Date.now(),u.paidUntil||0)+(p.plan==300?365:30)*864e5,b=db.batch();
  b.update(pr,{status:'approved'});b.update(ur,{paidUntil:until});await b.commit();toast(t('approved'));loadPay()}}

applyTheme();applyLang();
</script>
</body>
</html>
